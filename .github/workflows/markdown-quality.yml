name: Markdown quality

on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/markdown-quality.yml'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/markdown-quality.yml'

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" --config .markdownlint-cli2.jsonc
